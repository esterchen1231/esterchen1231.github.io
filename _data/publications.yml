- id: scenario-based-design
  title: "What Happened to Scenario-Based Design in HCI?: A Scoping Review"
  authors: 'J. M. Carroll, J. Jo, J. Kim, Y.-F. Lin, **E. Chen**'
  venue: ACM CHI 2026
  url: https://dl.acm.org/doi/abs/10.1145/3772318.3790899
  link_label: ACM Digital Library
  summary: "We reviewed 125 HCI papers and traced scenario-based design methods. Our framework maps who creates scenarios, how they are experienced, when they are used, and what they explore."
  keywords: Design Envisionment, Design Thinking, Human-Computer Interaction, Participatory Design, Design Fiction
  image: /images/publications/scenario-based-design.jpg
