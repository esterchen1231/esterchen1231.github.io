  image_height: 639
  image_alt: Family tree of scenario-based design methods organized by authorship, modality, design phase, and scope of inquiry

- id: deepfake-reliance
  title: "Effect of AI Performance, Risk Perception, and Trust on Human Dependence in Deepfake Detection AI Systems"
  authors: 'Y. Zhou, **E. Chen**, M. Pisipati, A. Xiong, S. Rajtmajer'
  venue: ACM CSCW 2025
  url: https://dl.acm.org/doi/abs/10.1145/3757588
  link_label: ACM Digital Library
  summary: "We studied trust and reliance in deepfake detection with 390 participants. Reported AI performance shaped trust, but trust did not significantly predict following AI advice."
  keywords: Deepfake, Human-AI Collaboration, Human-AI Decision Making, Trust
