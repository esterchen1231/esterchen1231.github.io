<div class="theme-picker" role="radiogroup" aria-label="Color theme">
  <div class="theme-picker__track">
    <span class="theme-picker__indicator" aria-hidden="true"></span>
    <button class="theme-picker__option" type="button" role="radio" data-theme-option="light" aria-label="Day mode" title="Day mode" aria-checked="true" tabindex="0"><span aria-hidden="true">☀️</span></button>
    <button class="theme-picker__option" type="button" role="radio" data-theme-option="dark" aria-label="Night mode" title="Night mode" aria-checked="false" tabindex="-1"><span aria-hidden="true">🌙</span></button>
    <button class="theme-picker__option" type="button" role="radio" data-theme-option="matcha" aria-label="Matcha mode" title="Matcha mode" aria-checked="false" tabindex="-1"><span aria-hidden="true">🍵</span></button>
    <button class="theme-picker__option" type="button" role="radio" data-theme-option="paper" aria-label="Paper mode" title="Paper mode" aria-checked="false" tabindex="-1"><span aria-hidden="true">📖</span></button>
    <button class="theme-picker__option" type="button" role="radio" data-theme-option="dusk" aria-label="Dusk mode" title="Dusk mode" aria-checked="false" tabindex="-1"><span aria-hidden="true">🌆</span></button>
  </div>
  <span class="theme-picker__name" aria-hidden="true">Day</span>
</div>
